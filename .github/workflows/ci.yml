name: Intégration continue

# Tests à chaque envoi sur main et à chaque demande de fusion ; à chaque étiquette de version (v*),
# l'AppImage est aussi fabriquée sur une machine propre et gardée comme artefact du flux (elle ne
# remplace pas celle de la version publiée, construite et vérifiée par son empreinte SHA-256).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'site/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # Pour déposer les erreurs de compilation sur la demande de fusion quand ça échoue :
    # le journal complet d'un run n'est lisible que sur un hôte à part, et un contributeur
    # (ou un agent) n'y a pas toujours accès.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dépendances de compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee sortie-tests.log
      - name: Avertissements du compilateur
        shell: bash
        run: |
          set -o pipefail
          RUSTFLAGS="-D warnings" cargo build --locked 2>&1 | tee sortie-compile.log
      - name: Déposer les erreurs sur la demande de fusion
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Erreurs de compilation ou de tests (${GITHUB_SHA::7})"
            echo '```'
            grep -hE '^(error|warning)(\[E?[0-9]*\])?:|^ *--> |^test .* FAILED|^failures:' sortie-tests.log sortie-compile.log 2>/dev/null | head -100
            echo '```'
          } > erreurs.md
          gh pr comment "$PR" --body-file erreurs.md

  # Reconnaissance Windows : ce que le portage natif (docs/PLAN.md, étape 0) devra rendre
  # compilable. `continue-on-error` pour l'instant — les crates Wayland/X11 ne se construisent
  # pas encore pour Windows, et c'est justement l'objet de l'étape 0 (les passer sous
  # `[target.'cfg(target_os = "linux")'.dependencies]`). Le journal dit lesquelles bloquent.
  # Il deviendra bloquant dès que `cargo check` passera : ne pas le retirer avant.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Ce qui compile déjà pour Windows
        run: cargo check --locked --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath windows-check.log
      - name: Résumé (crates en cause)
        if: always()
        run: |
          Select-String -Path windows-check.log -Pattern '^error(\[|:)' | Measure-Object | ForEach-Object { "erreurs : $($_.Count)" }
          Select-String -Path windows-check.log -Pattern 'error(\[E\d+\])?: (could not compile|failed to)' | Select-Object -First 25 | ForEach-Object { $_.Line }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-check-log
          path: windows-check.log
          if-no-files-found: ignore

  appimage:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dépendances de compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config libfuse2t64 || sudo apt-get install -y libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: L'étiquette correspond à la version de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Cargo.toml dit $v, l'étiquette ${GITHUB_REF_NAME}"; exit 1; }
      - name: Fabriquer l'AppImage
        run: |
          out="$(bash scripts/appimage.sh | tail -n1)"
          sha256sum "$out" | tee "$out.sha256"
          "$out" --appimage-extract-and-run version || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LKatta-AppImage
          path: dist/*
          if-no-files-found: error
