[package]
name = "lkatta"
version = "0.3.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "L Katta (Lemur Kata) : un petit maki assistant de bureau pour Linux/KDE, propulsé par le moteur de Tontolo."
repository = "https://github.com/raantss18/L-Katta"
authors = ["RANIRIAMANJAKA Antsa"]
readme = "README.md"

[[bin]]
name = "lkatta"
path = "src/main.rs"

[dependencies]
# Portables : aucun de ces crates ne dépend d'un système. Rendu logiciel, texte, réseau, JSON,
# SQLite embarquée — la même base sur Linux et sur Windows, pour un seul binaire.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"
# Cerveau et outils.
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
roxmltree = "0.21"
fastrand = "2"
regex-lite = "0.1"
base64 = "0.22"
rusqlite = { version = "0.42.0", features = ["bundled"] }
ed25519-compact = { version = "2.6.1", default-features = false, features = ["std"] }

# Linux : Wayland natif (layer-shell), X11, D-Bus, libc.
#
# Sous une table par cible pour qu'un `cargo check` visant Windows ne les résolve même pas.
# `wayland-sys` commence par `use std::os::unix::io::RawFd`, qui n'existe pas sur Windows :
# tant que ces crates étaient dans `[dependencies]`, ils cassaient la compilation avant même
# que le code de L Katta soit examiné (c'est ce que rapportait le job CI `windows`).
#
# Déplacer une dépendance ici ne change pas le `Cargo.lock`, qui liste l'union des
# dépendances quelle que soit leur cible : le `--locked` de la CI reste satisfait, et aucune
# version ne bouge.
[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14", features = ["shape", "randr", "cursor"] }
xkbcommon = { version = "0.8", default-features = false }
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }
notify-rust = "4"
libc = "0.2"

# Windows : rien pour l'instant. Les liaisons Win32 arriveront avec l'étape 1 du portage
# (docs/PLAN.md). Une dépendance nouvelle exige un `Cargo.lock` mis à jour, ce qui ne peut se
# faire qu'avec cargo en main — donc pas depuis cet environnement.

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
opt-level = "s"
